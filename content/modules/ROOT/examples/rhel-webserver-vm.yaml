apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: rhel-webserver
  namespace: acs-virt
  labels:
    app: rhel-webserver
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: rhel-webserver
        kubevirt.io/size: small
    spec:
      domain:
        cpu:
          cores: 1
          sockets: 1
          threads: 1
        devices:
          # Required for ACS VM scanning: roxagent reports over VSOCK to the collector relay
          autoattachVSOCK: true
          disks:
            - bootOrder: 1
              disk:
                bus: virtio
              name: rootdisk
            - disk:
                bus: virtio
              name: cloudinitdisk
          interfaces:
            - masquerade: {}
              model: virtio
              name: default
          rng: {}
        features:
          acpi: {}
          smm:
            enabled: true
        firmware:
          bootloader:
            efi: {}
        machine:
          type: pc-q35-rhel9.6.0
        memory:
          guest: 2Gi
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 180
      volumes:
        - dataVolume:
            name: rhel-webserver
          name: rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |-
              #cloud-config
              user: cloud-user
              password: redhat
              chpasswd: { expire: false }
              runcmd:
                - curl -k -o /tmp/katello-ca-consumer-latest.noarch.rpm https://demosat-ha.infra.demo.redhat.com/pub/katello-ca-consumer-latest.noarch.rpm
                - rpm -Uvh /tmp/katello-ca-consumer-latest.noarch.rpm
                - |
                  subscription-manager register \
                    --activationkey="demosat-smt-lb1161-wolfgang" \
                    --org="Red_Hat_RHDP_Labs" \
                    --name="rhel-webserver-68q9h-2" \
                    --force
                - subscription-manager release --set=9.6
                - |
                  subscription-manager repos \
                    --enable=rhel-9-for-x86_64-baseos-eus-rpms \
                    --enable=rhel-9-for-x86_64-appstream-eus-rpms
                - dnf clean all
                - dnf update -y
                - |
                  dnf install -y \
                    httpd curl wget openssl openssl-libs zlib libxml2 \
                    ghostscript perl nginx tar gzip nmap-ncat bzip2 zip unzip \
                    freetype libjpeg-turbo libtiff libpng gnutls 2>/dev/null || true
                - curl -L -f -o /tmp/roxagent https://mirror.openshift.com/pub/rhacs/assets/4.10.0/bin/linux/roxagent
                - chmod +x /tmp/roxagent
                - mv /tmp/roxagent /usr/local/bin/roxagent
                - restorecon -v /usr/local/bin/roxagent
                - |
                  printf '%s\n' \
                    'SHELL=/bin/bash' \
                    'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' \
                    'MAILTO=root' \
                    '# Run roxagent every 10 minutes as root' \
                    '*/10 * * * * root /usr/local/bin/roxagent --daemon' \
                  | tee /etc/cron.d/roxagent > /dev/null
                - chmod 644 /etc/cron.d/roxagent
                - restorecon -vF /etc/cron.d/roxagent
                - systemctl restart crond
                - systemctl enable --now httpd
                - echo 'rhel-webserver - ACS VM scanning demo' > /var/www/html/index.html
                - /usr/local/bin/roxagent --daemon
                - echo "Setup complete"
  dataVolumeTemplates:
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      metadata:
        name: rhel-webserver
      spec:
        sourceRef:
          kind: DataSource
          name: rhel9
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
