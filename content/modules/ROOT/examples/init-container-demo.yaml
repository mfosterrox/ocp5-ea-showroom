# Two deployments that demonstrate ACS 5 init container coverage:
# - insecure-init-test: obsolete init image with critical CVEs (image scanning)
# - privileged-init-test: privileged init container (Build/Deploy policy evaluation)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-init-test
  namespace: acs-init-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insecure-init-test
  template:
    metadata:
      labels:
        app: insecure-init-test
    spec:
      initContainers:
      - name: vulnerable-prep
        image: python:2.7-slim
        command: ['sh', '-c', 'echo Preparing environment...']
      containers:
      - name: main-app
        image: registry.access.redhat.com/ubi9/ubi-minimal:latest
        command: ['sleep', '3600']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: privileged-init-test
  namespace: acs-init-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: privileged-init-test
  template:
    metadata:
      labels:
        app: privileged-init-test
    spec:
      initContainers:
      - name: privileged-prep
        image: registry.access.redhat.com/ubi9/ubi-minimal:latest
        command: ['sh', '-c', 'echo Preparing environment...']
        securityContext:
          privileged: true
      containers:
      - name: main-app
        image: registry.access.redhat.com/ubi9/ubi-minimal:latest
        command: ['sleep', '3600']
